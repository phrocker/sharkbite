[build-system]
requires = [
  "setuptools==82.0.1; python_version < '3.10'",
  "setuptools==84.1.0; python_version >= '3.10'",
  "wheel==0.46.2",
]
build-backend = "setuptools.build_meta"

[project]
name = "sharkbite"
version = "1.4.4"
description = "Accumulo-compatible Python bindings"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Shoal contributors"}]
keywords = ["accumulo", "sharkbite", "shoal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/phrocker/sharkbite"
Issues = "https://github.com/phrocker/sharkbite/issues"
Source = "https://github.com/phrocker/sharkbite"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sharkbite = ["py.typed", ".libs/*"]

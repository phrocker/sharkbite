[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "shoal-sharkbite"
version = "1.3.0"
description = "Sharkbite-compatible Python bindings for the Shoal stable C ABI"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Shoal contributors"}]
keywords = ["accumulo", "sharkbite", "shoal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/phrocker/shoal-oss"
Issues = "https://github.com/phrocker/shoal-oss/issues"
Source = "https://github.com/phrocker/shoal-oss"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sharkbite = ["py.typed", ".libs/*"]

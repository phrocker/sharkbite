services:
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: shoaladmin
      MINIO_ROOT_PASSWORD: shoal-emulator-only
    ports:
      - "127.0.0.1:9000:9000"

  fake-gcs-server:
    image: fsouza/fake-gcs-server:1.54.0
    command: ["-scheme", "http", "-port", "4443", "-public-host", "127.0.0.1:4443"]
    ports:
      - "127.0.0.1:4443:4443"

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck"]
    environment:
      # Public, local-only test account, not a cloud credential.
      AZURITE_ACCOUNTS: "shoal:c2hvYWwtZW11bGF0b3Itb25seS1ub3QtYS1zZWNyZXQ="
    ports:
      - "127.0.0.1:10000:10000"

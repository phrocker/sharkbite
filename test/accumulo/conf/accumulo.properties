# Disposable local-cluster configuration. Do not use these credentials or
# memory settings outside the test harness.
instance.volumes=hdfs://namenode:8020/accumulo
instance.zookeeper.host=zookeeper:2181
instance.secret=shoal-test-instance-secret

tserver.memory.maps.native.enabled=false
compaction.service.shoal.planner=org.apache.accumulo.core.spi.compaction.RatioBasedCompactionPlanner
compaction.service.shoal.planner.opts.groups=[{"group":"shoal_default"}]

apiVersion: v1
kind: Secret
metadata:
  name: shoal-object-storage-credentials
  labels:
    app.kubernetes.io/name: shoal
    app.kubernetes.io/part-of: shoal-platform
type: Opaque
stringData:
  # Placeholder only. Replace with a real GCS service account JSON key if not
  # using Workload Identity / node ADC. Mounted as GOOGLE_APPLICATION_CREDENTIALS.
  key.json: |
    {"type":"service_account","project_id":"REPLACE_ME"}
  # Placeholder only. cmd/shoal requires -password or SHOAL_PASSWORD for its
  # metadata-table walk credentials.
  accumulo-password: REPLACE_ME
  # Required by shoal-tserver and shoal-compactor. The instance secret
  # authenticates their ZooKeeper ServiceLock sessions. The system token is
  # the base64 text passed by the Accumulo manager in internal TCredentials.
  accumulo-instance-secret: REPLACE_ME
  accumulo-system-token-base64: REPLACE_ME

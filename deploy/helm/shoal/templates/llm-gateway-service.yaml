{{- if eq (include "shoal.llmGatewayEnabled" .) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shoal.llmGatewayName" . }}
  labels:
    {{- include "shoal.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-gateway
  {{- with .Values.llmGateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.llmGateway.service.type | quote }}
  selector:
    {{- include "shoal.llmGatewaySelectorLabels" . | nindent 4 }}
  # One port, and it is not the health port. The probe surface exists for the
  # kubelet, which reaches the pod directly; publishing it would make an
  # unauthenticated endpoint routable in-cluster for no reason. It is also the
  # one endpoint on this pod that answers without passing through admission, so
  # the fewer things that can reach it, the better.
  {{- $port := ternary "https" "http" (eq (include "shoal.llmGatewayTLS" .) "true") }}
  ports:
    - name: {{ $port }}
      port: {{ .Values.llmGateway.servicePort }}
      targetPort: {{ $port }}
{{- end }}

name: Publish shoal-embed image

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/shoal-embed-image.yml"
      - ".dockerignore"
      - "Dockerfile.shoal-embed"
      - "Makefile"
      - "cmd/shoal-embed/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "proto/embed.proto"
      - "test/container/**"
      - "wal-quorum-sidecar/go.mod"
      - "wal-quorum-sidecar/go.sum"

permissions:
  contents: read

concurrency:
  group: shoal-embed-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/phrocker/shoal-oss/shoal-embed

jobs:
  validate:
    name: Build and smoke test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and smoke test
        run: |
          make container-smoke \
            IMAGE=shoal-embed:smoke \
            VERSION="${GITHUB_REF_NAME}" \
            REVISION="${GITHUB_SHA}" \
            CREATED="$(git show -s --format=%cI HEAD)"

  publish:
    name: Build and publish multi-arch image
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=shoal-embed
            org.opencontainers.image.description=Standalone Shoal embedded storage engine with a gRPC API

      - name: Validate release tag
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -z "$IMAGE_TAGS" ]; then
            echo "::error::${GITHUB_REF_NAME} is not a valid semantic-version tag (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.shoal-embed
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

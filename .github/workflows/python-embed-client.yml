name: Python ShoalEmbed client

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/python-embed-client.yml"
      - "proto/embed.proto"
      - "python/embed-client/**"
      - "python/pyproject.toml"
      - "python/src/sharkbite/_version.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/python-embed-client.yml"
      - "proto/embed.proto"
      - "python/embed-client/**"
      - "python/pyproject.toml"
      - "python/src/sharkbite/_version.py"
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish the selected version tag after pypi environment approval"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Check generated code and build wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check version and publication ref
        shell: bash
        env:
          PUBLISH_TO_PYPI: ${{ inputs.publish_to_pypi }}
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          native = tomllib.loads(Path("python/pyproject.toml").read_text())["project"]["version"]
          client = tomllib.loads(Path("python/embed-client/pyproject.toml").read_text())["project"]["version"]
          def source_version(path):
              tree = ast.parse(Path(path).read_text())
              return next(ast.literal_eval(node.value) for node in tree.body
                          if isinstance(node, ast.Assign) and
                          any(isinstance(target, ast.Name) and target.id == "__version__"
                              for target in node.targets))
          if not native == client == source_version("python/src/sharkbite/_version.py") == source_version(
              "python/embed-client/src/shoal_embed_client/_version.py"
          ):
              raise SystemExit("native and embed client versions must match")
          if os.environ["PUBLISH_TO_PYPI"] == "true":
              if os.environ["GITHUB_REF_TYPE"] != "tag" or os.environ["GITHUB_REF_NAME"] != f"v{client}":
                  raise SystemExit("PyPI publication requires the matching version tag")
          PY
      - name: Check generated stubs
        run: |
          python -m pip install -r python/embed-client/requirements-codegen.txt
          python python/embed-client/scripts/generate.py --check
      - name: Build wheel and source distribution
        run: |
          python -m pip install build==1.2.2 setuptools==82.0.1 wheel==0.46.2
          python -m build --no-isolation python/embed-client
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: shoal-embed-client-${{ github.sha }}
          path: |
            python/embed-client/dist/*.whl
            python/embed-client/dist/*.tar.gz
          if-no-files-found: error

  test:
    name: Clean wheel install (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: shoal-embed-client-${{ github.sha }}
          path: dist
      - name: Install only the wheel and declared dependencies
        run: python -m pip install dist/*.whl
      - name: Verify package, protocol, and mixed-version behavior
        run: |
          python - <<'PY'
          from importlib import resources
          from shoal_embed_client import embed_pb2, embed_pb2_grpc

          proto = resources.files("shoal_embed_client").joinpath("_proto/embed.proto")
          assert b"service ShoalEmbed" in proto.read_bytes()
          assert embed_pb2.StatusResponse and embed_pb2_grpc.ShoalEmbedStub
          PY
          python -m unittest discover -s python/embed-client/tests -v
      - name: Install source distribution in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/embed-sdist-venv"
          "$RUNNER_TEMP/embed-sdist-venv/bin/python" -m pip install dist/*.tar.gz
      - name: Verify source distribution install
        run: "$RUNNER_TEMP/embed-sdist-venv/bin/python" -m unittest discover -s python/embed-client/tests -v

  pypi-publish:
    name: Publish shoal-embed-client to PyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi && github.ref_type == 'tag'
    needs: [build, test]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/shoal-embed-client
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: shoal-embed-client-${{ github.sha }}
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

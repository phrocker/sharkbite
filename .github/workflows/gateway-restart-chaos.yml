name: Gateway restart chaos

on:
  pull_request:
    paths:
      - .github/workflows/gateway-restart-chaos.yml
      - internal/explorerfleet/dispatch_server_restart_chaos_test.go
      - scripts/verify_dispatch_restart_chaos.py
      - scripts/test_verify_dispatch_restart_chaos.py
  schedule:
    - cron: "23 5 * * 4"
  workflow_dispatch:
    inputs:
      seed:
        description: "Positive Go shuffle seed; blank chooses the current UTC epoch"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gateway-restart-chaos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  standalone:
    name: Lost claim answer and two-container server replacement
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOWORK: off
      SHOAL_CHAOS_SERVER_RESTART: "1"
      SHOAL_CHAOS_CONTAINER_IMAGE: ubuntu@sha256:a2d43bffc46670d7108bb3c0468c67c5557c4c92e83e1e34cbff1322ad1b94dc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify evidence gate rejects incomplete results
        run: python3 -m unittest scripts.test_verify_dispatch_restart_chaos
      - name: Select seed
        id: config
        shell: bash
        env:
          REQUESTED_SEED: ${{ inputs.seed }}
        run: |
          seed="$REQUESTED_SEED"
          if [[ -z "$seed" ]]; then seed="$(date -u +%s)"; fi
          if [[ ! "$seed" =~ ^[1-9][0-9]*$ ]] ||
             (( ${#seed} > 19 )) ||
             { (( ${#seed} == 19 )) && [[ "$seed" > "9223372036854775807" ]]; }; then
            echo "::error::Seed must be a positive signed 64-bit integer"
            exit 1
          fi
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
      - name: Pull and verify pinned container runtime
        shell: bash
        run: |
          mkdir -p evidence
          : > evidence/image-digest.txt
          set +e
          docker pull "$SHOAL_CHAOS_CONTAINER_IMAGE" > evidence/image-pull.log 2>&1
          status=$?
          if [[ "$status" == 0 ]]; then
            resolved="$(docker image inspect "$SHOAL_CHAOS_CONTAINER_IMAGE" --format '{{index .RepoDigests 0}}' 2>> evidence/image-pull.log)"
            inspect_status=$?
            if [[ "$inspect_status" != 0 || "$resolved" != "$SHOAL_CHAOS_CONTAINER_IMAGE" ]]; then status=1; fi
            echo "$resolved" > evidence/image-digest.txt
          fi
          echo "$status" > evidence/image-pull-exit.txt
      - name: Inject lost claim answer and hard-kill server
        shell: bash
        env:
          SEED: ${{ steps.config.outputs.seed }}
        run: |
          if [[ "$(cat evidence/image-pull-exit.txt)" != 0 ]]; then
            : > evidence/events.jsonl
            : > evidence/stderr.log
            echo 125 > evidence/exit-code.txt
            exit 0
          fi
          set +e
          timeout --signal=TERM --kill-after=30s 20m \
            go test -race -json -shuffle="$SEED" -count=5 \
            ./internal/explorerfleet \
            -run '^TestDispatchClaimSurvivesLostResponseAndServerSIGKILL$' \
            > evidence/events.jsonl 2> evidence/stderr.log
          status=$?
          set -e
          echo "$status" > evidence/exit-code.txt
      - name: Verify the durable claim invariant and write manifest
        shell: bash
        env:
          SEED: ${{ steps.config.outputs.seed }}
        run: |
          python3 scripts/verify_dispatch_restart_chaos.py \
            --events evidence/events.jsonl --manifest evidence/manifest.json \
            --exit-code "$(cat evidence/exit-code.txt)" --repeats 5 --seed "$SEED" \
            --commit "$GITHUB_SHA" --image-ref "$SHOAL_CHAOS_CONTAINER_IMAGE" \
            --go-version "$(go version)" --runner-image "$ImageOS/$ImageVersion" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain evidence even when an invariant fails
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gateway-restart-chaos-${{ github.sha }}-${{ steps.config.outputs.seed }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

name: Accumulo 4 live tserver evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/accumulo-live-tserver.yml"
      - "go.mod"
      - "go.sum"
      - "wal-quorum-sidecar/**"
      - "cmd/shoal-conformance/**"
      - "cmd/shoal-tserver/**"
      - "internal/conformance/**"
      - "internal/hostedingest/**"
      - "internal/ingestservice/**"
      - "internal/memtable/**"
      - "internal/qwal/**"
      - "internal/storage/hdfs/**"
      - "internal/tserver/**"
      - "internal/tserverrpc/**"
      - "test/accumulo/**"
      - "test/conformance/**"

permissions:
  contents: read

jobs:
  live-tserver:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare evidence directory
        run: mkdir -p evidence
      - name: Validate pinned harness and verdict logic
        run: make test-accumulo-static 2>&1 | tee evidence/static.log
      - name: Build conformance CLI
        run: go build -o "$RUNNER_TEMP/shoal-conformance" ./cmd/shoal-conformance 2>&1 | tee evidence/build.log
      - name: Run pinned live tserver gate
        run: |
          "$RUNNER_TEMP/shoal-conformance" \
            -mode live -required tserver \
            -live-log-dir evidence -output evidence/verdict.json \
            2>&1 | tee evidence/runner.log
      - name: Upload verdict and live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accumulo-live-tserver-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

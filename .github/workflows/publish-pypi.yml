name: Validate and publish compatibility package

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-pypi.yml"
      - "MANIFEST.in"
      - "PYTHONREADME.md"
      - "RELEASE.md"
      - "compat_src/**"
      - "pyproject.toml"
      - "scripts/**"
      - "setup.py"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-pypi.yml"
      - "MANIFEST.in"
      - "PYTHONREADME.md"
      - "RELEASE.md"
      - "compat_src/**"
      - "pyproject.toml"
      - "scripts/**"
      - "setup.py"
      - "tests/**"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharkbite-pypi-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, inspect, and smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build verification tools
        run: python -m pip install --disable-pip-version-check build==1.2.2.post1 twine==6.1.0

      - name: Validate release tag
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$RELEASE_TAG" = "v${version}" || {
            echo "::error::Release tag ${RELEASE_TAG} does not match sharkbite ${version}"
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release commit ${GITHUB_SHA} is not on origin/main"
            exit 1
          }

      - name: Build distributions
        run: python -m build

      - name: Download exact Shoal implementation
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python -m pip download \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --dest implementation-dist \
            "shoal-sharkbite==${version}"

      - name: Verify metadata and file ownership
        shell: bash
        run: |
          python -m twine check dist/*
          python scripts/verify_metapackage.py \
            dist/*.whl \
            --sdist dist/*.tar.gz \
            --implementation-wheel implementation-dist/*.whl

      - name: Resolve, install, and import through compatibility package
        shell: bash
        run: |
          python -m venv smoke-env
          smoke-env/bin/python -m pip install \
            --no-index \
            --find-links dist \
            --find-links implementation-dist \
            sharkbite
          smoke-env/bin/python -m pip check
          cd smoke-env
          bin/python - <<'PY'
          import importlib.metadata
          from pathlib import Path

          import pysharkbite
          import sharkbite

          assert importlib.metadata.version("sharkbite") == "1.3.0"
          assert importlib.metadata.version("shoal-sharkbite") == "1.3.0"
          assert sharkbite.__version__ == pysharkbite.__version__ == "1.3.0"
          def owners(path):
              return {
                  distribution.metadata["Name"]
                  for distribution in importlib.metadata.distributions()
                  if any(str(file).replace("\\", "/") == path for file in distribution.files or ())
              }
          assert owners("sharkbite/__init__.py") == {"sharkbite", "shoal-sharkbite"}
          assert owners("pysharkbite/__init__.py") == {"shoal-sharkbite"}
          bridge = importlib.metadata.distribution("sharkbite")
          bridge_payload = {
              str(path)
              for path in bridge.files or ()
              if not any(part.endswith(".dist-info") for part in path.parts)
              and "__pycache__" not in path.parts
          }
          assert bridge_payload == {"sharkbite/__init__.py"}, bridge_payload
          implementation = importlib.metadata.distribution("shoal-sharkbite")
          native_files = [
              path for path in implementation.files or ()
              if ".libs" in path.parts and Path(path).suffix in {".so", ".dll", ".dylib"}
          ]
          assert native_files, "shoal-sharkbite has no bundled native library"
          PY

      - name: Set up Python 3.9 for historical upgrades
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"

      - name: Upgrade historical Sharkbite in place
        shell: bash
        run: |
          python -m venv upgrade-env
          upgrade-env/bin/python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            "sharkbite==1.2.0.3"
          upgrade-env/bin/python -m pip install \
            --disable-pip-version-check \
            --no-index \
            --find-links dist \
            --find-links implementation-dist \
            --upgrade \
            "sharkbite==1.3.0"
          upgrade-env/bin/python -m pip check
          (
            cd upgrade-env
            bin/python - <<'PY'
          import importlib.metadata

          import pysharkbite
          import sharkbite

          assert sharkbite.__version__ == pysharkbite.__version__ == "1.3.0"
          assert sharkbite.Connector is pysharkbite.Connector
          def owners(path):
              return {
                  distribution.metadata["Name"]
                  for distribution in importlib.metadata.distributions()
                  if any(str(file).replace("\\", "/") == path for file in distribution.files or ())
              }
          assert owners("sharkbite/__init__.py") == {"sharkbite", "shoal-sharkbite"}
          assert owners("pysharkbite/__init__.py") == {"shoal-sharkbite"}
          PY
          )

      - name: Upgrade with Shoal already installed
        shell: bash
        run: |
          python -m venv satisfied-env
          satisfied-env/bin/python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            "sharkbite==1.2.0.3"
          satisfied-env/bin/python -m pip install \
            --no-index \
            --no-deps \
            implementation-dist/*.whl
          satisfied-env/bin/python -m pip install \
            --disable-pip-version-check \
            --no-index \
            --find-links dist \
            --find-links implementation-dist \
            --upgrade \
            "sharkbite==1.3.0"
          satisfied-env/bin/python -m pip check
          (
            cd satisfied-env
            bin/python - <<'PY'
          import pysharkbite
          import sharkbite

          assert sharkbite.__version__ == pysharkbite.__version__ == "1.3.0"
          assert sharkbite.Connector is pysharkbite.Connector
          PY
          )

      - name: Verify split-site package discovery
        shell: bash
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-index \
            --no-deps \
            --target split-system \
            implementation-dist/*.whl
          python -m pip install \
            --disable-pip-version-check \
            --no-index \
            --no-deps \
            --target split-user \
            dist/*.whl
          PYTHONPATH="$PWD/split-user:$PWD/split-system" python - <<'PY'
          import pysharkbite
          import sharkbite

          assert sharkbite.__version__ == pysharkbite.__version__ == "1.3.0"
          assert sharkbite.Connector is pysharkbite.Connector
          PY

      - name: Generate checksums
        shell: bash
        run: |
          mkdir release-artifacts
          cp dist/*.whl dist/*.tar.gz release-artifacts/
          cd release-artifacts
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS

      - name: Upload verified distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sharkbite-pypi-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest verified distributions
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: sharkbite-pypi-${{ github.sha }}
          path: release-artifacts

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            release-artifacts/*.whl
            release-artifacts/*.tar.gz
            release-artifacts/SHA256SUMS

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [build, attest]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/sharkbite/
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - name: Checkout verification script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Download verified distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: sharkbite-pypi-${{ github.sha }}
          path: release-artifacts

      - name: Require implementation release on PyPI
        run: python scripts/verify_metapackage.py release-artifacts/*.whl --require-pypi

      - name: Verify Shoal release, PyPI artifact, native ABI, and ownership
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          mkdir shoal-release pypi-download
          gh release download "v${version}" \
            --repo phrocker/shoal-oss \
            --pattern "shoal_sharkbite-${version}-*" \
            --pattern "shoal_sharkbite-${version}.tar.gz" \
            --pattern SHA256SUMS \
            --dir shoal-release
          (cd shoal-release && sha256sum -c SHA256SUMS)
          gh attestation verify shoal-release/*.whl --repo phrocker/shoal-oss
          gh attestation verify shoal-release/*.tar.gz --repo phrocker/shoal-oss
          python -m pip download \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --dest pypi-download \
            "shoal-sharkbite==${version}"
          wheel=$(find pypi-download -maxdepth 1 -name '*.whl' -print -quit)
          release_wheel="shoal-release/$(basename "$wheel")"
          test -f "$release_wheel"
          cmp "$wheel" "$release_wheel"
          python scripts/verify_metapackage.py \
            release-artifacts/*.whl \
            --implementation-wheel "$wheel"
          python -m venv implementation-smoke
          implementation-smoke/bin/python -m pip install --no-index --no-deps "$wheel"
          (
            cd implementation-smoke
            bin/python - <<'PY'
          import importlib.metadata
          from pathlib import Path

          import pysharkbite
          import sharkbite
          from sharkbite._native import NativeAPI

          version = importlib.metadata.version("shoal-sharkbite")
          assert sharkbite.__version__ == pysharkbite.__version__ == version
          def owners(path):
              return {
                  distribution.metadata["Name"]
                  for distribution in importlib.metadata.distributions()
                  if any(str(file).replace("\\", "/") == path for file in distribution.files or ())
              }
          assert owners("sharkbite/__init__.py") == {"shoal-sharkbite"}
          assert owners("pysharkbite/__init__.py") == {"shoal-sharkbite"}
          distribution = importlib.metadata.distribution("shoal-sharkbite")
          native_files = [
              path for path in distribution.files or ()
              if ".libs" in path.parts and Path(path).suffix in {".so", ".dll", ".dylib"}
          ]
          assert native_files, "shoal-sharkbite has no bundled native library"
          api = NativeAPI()
          assert api.version >= (1, 19, 0), api.version
          assert api.capabilities, "Shoal ABI exposes no capabilities"
          PY
          )
          implementation-smoke/bin/python -m pip install \
            --no-index \
            --no-deps \
            release-artifacts/*.whl
          (
            cd implementation-smoke
            bin/python - <<'PY'
          import importlib.metadata

          assert importlib.metadata.version("sharkbite") == importlib.metadata.version(
              "shoal-sharkbite"
          )
          def owners(path):
              return {
                  distribution.metadata["Name"]
                  for distribution in importlib.metadata.distributions()
                  if any(str(file).replace("\\", "/") == path for file in distribution.files or ())
              }
          assert owners("sharkbite/__init__.py") == {"sharkbite", "shoal-sharkbite"}
          assert owners("pysharkbite/__init__.py") == {"shoal-sharkbite"}
          PY
            bin/python -m pip check
          )

      - name: Select PyPI distributions
        shell: bash
        run: |
          mkdir publish-dist
          cp release-artifacts/*.whl release-artifacts/*.tar.gz publish-dist/

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
        with:
          packages-dir: publish-dist

  release-assets:
    name: Publish checksummed GitHub release assets
    if: github.event_name == 'release'
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: sharkbite-pypi-${{ github.sha }}
          path: release-artifacts

      - name: Upload immutable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-artifacts/* --repo "$GITHUB_REPOSITORY"

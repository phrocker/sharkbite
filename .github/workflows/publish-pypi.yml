name: Validate and publish compatibility package

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish-pypi.yml"
      - "MANIFEST.in"
      - "PYTHONREADME.md"
      - "RELEASE.md"
      - "pyproject.toml"
      - "scripts/**"
      - "setup.py"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-pypi.yml"
      - "MANIFEST.in"
      - "PYTHONREADME.md"
      - "RELEASE.md"
      - "pyproject.toml"
      - "scripts/**"
      - "setup.py"
      - "tests/**"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharkbite-pypi-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, inspect, and smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build verification tools
        run: python -m pip install --disable-pip-version-check build==1.2.2.post1 twine==6.1.0

      - name: Validate release tag
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$RELEASE_TAG" = "v${version}" || {
            echo "::error::Release tag ${RELEASE_TAG} does not match sharkbite ${version}"
            exit 1
          }

      - name: Build distributions
        run: python -m build

      - name: Verify metadata and file ownership
        shell: bash
        run: |
          python -m twine check dist/*
          python scripts/verify_metapackage.py dist/*.whl --sdist dist/*.tar.gz

      - name: Build local implementation fixture
        run: python -m build --wheel --outdir stub-dist tests/stub_implementation

      - name: Resolve, install, and import through compatibility package
        shell: bash
        run: |
          python -m venv smoke-env
          smoke-env/bin/python -m pip install --no-index --find-links dist --find-links stub-dist sharkbite
          cd smoke-env
          bin/python - <<'PY'
          import importlib.metadata
          import pysharkbite
          import sharkbite

          assert importlib.metadata.version("sharkbite") == "1.3.0"
          assert importlib.metadata.version("shoal-sharkbite") == "0.5.0"
          assert sharkbite.__version__ == pysharkbite.__version__ == "0.5.0"
          owners = importlib.metadata.packages_distributions()
          assert owners["sharkbite"] == ["shoal-sharkbite"], owners["sharkbite"]
          assert owners["pysharkbite"] == ["shoal-sharkbite"], owners["pysharkbite"]
          PY

      - name: Generate checksums
        shell: bash
        run: |
          mkdir release-artifacts
          cp dist/*.whl dist/*.tar.gz release-artifacts/
          cd release-artifacts
          sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Upload verified distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sharkbite-pypi-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest verified distributions
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: sharkbite-pypi-${{ github.sha }}
          path: release-artifacts

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            release-artifacts/*.whl
            release-artifacts/*.tar.gz
            release-artifacts/SHA256SUMS

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [build, attest]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/sharkbite/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout verification script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download verified distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: sharkbite-pypi-${{ github.sha }}
          path: release-artifacts

      - name: Require implementation release on PyPI
        run: python scripts/verify_metapackage.py release-artifacts/*.whl --require-pypi

      - name: Select PyPI distributions
        shell: bash
        run: |
          mkdir publish-dist
          cp release-artifacts/*.whl release-artifacts/*.tar.gz publish-dist/

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
        with:
          packages-dir: publish-dist

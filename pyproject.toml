[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sharkbite"
version = "1.3.0"
description = "Compatibility metapackage for the Shoal-maintained Sharkbite Python bindings"
readme = "PYTHONREADME.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Marc Parisi"}]
keywords = ["accumulo", "sharkbite", "shoal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["shoal-sharkbite==0.5.0"]

[project.urls]
Homepage = "https://github.com/phrocker/shoal-oss"
Issues = "https://github.com/phrocker/shoal-oss/issues"
Source = "https://github.com/phrocker/sharkbite"

[tool.setuptools]
packages = []
py-modules = []
include-package-data = false
